<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>대기운영일지</title>
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#f4f6f9;min-height:100vh;padding-bottom:80px;}

/* ── Header ── */
.hdr{background:#0f2744;padding-top:env(safe-area-inset-top,0);position:sticky;top:0;z-index:100;}
.hdr-inner{display:flex;align-items:center;padding:13px 14px;}
.back-btn{background:none;border:none;color:white;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.back-btn:active{background:rgba(255,255,255,.12);}
.hdr-title{flex:1;text-align:center;font-size:17px;font-weight:700;color:white;letter-spacing:-.3px;}
.hdr-space{width:36px;flex-shrink:0;}

/* ── Controls ── */
.ctrl-wrap{background:white;border-bottom:1px solid #e8ecf0;padding:12px 14px;position:sticky;top:62px;z-index:90;}
.mode-seg{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;margin-bottom:10px;}
.mode-btn{flex:1;padding:8px 4px;border:none;background:none;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;border-radius:8px;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.mode-btn.on{background:white;color:#0f2744;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.date-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;}
.date-lbl{font-size:12px;font-weight:600;color:#6b7280;flex-shrink:0;}
.date-inp{flex:1;min-width:0;height:38px;border:1px solid #e2e8f0;border-radius:8px;padding:0 10px;font-size:14px;font-family:inherit;color:#0f2744;outline:none;background:white;}
.date-inp:focus{border-color:#0f2744;}
.qry-btn{height:38px;padding:0 14px;background:#0f2744;color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;flex-shrink:0;display:none;}

/* ── Status chip (신규 입력 모드) ── */
.status-chip{display:inline-flex;align-items:center;justify-content:center;width:58px;font-size:11px;font-weight:600;padding:4px 0;border-radius:20px;white-space:nowrap;flex-shrink:0;letter-spacing:-.1px;}
.chip-new{background:#f1f5f9;color:#64748b;}
.chip-done{background:#dcfce7;color:#15803d;}

/* ── Banners ── */
.edit-banner{background:#fef9c3;border-bottom:1px solid #fde68a;padding:10px 14px;display:none;align-items:flex-start;gap:6px;}
.edit-banner.on{display:flex;}
.edit-banner svg{flex-shrink:0;margin-top:2px;}
.edit-banner-txt{font-size:12.5px;color:#854d0e;line-height:1.5;white-space:pre-line;}
.sems-row{padding:9px 14px;border-bottom:1px solid #e5e7eb;background:#f8fafc;display:none;align-items:center;gap:6px;flex-wrap:wrap;}
.sems-row.on{display:flex;}
.sems-lbl{font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.3px;flex-shrink:0;}
.sems-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;flex-shrink:0;}
.sems-pend{background:#fed7aa;color:#c2410c;border:1px solid #fb923c;}
.sems-done{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;}
.sems-desc{font-size:12px;color:#6b7280;flex:1;min-width:0;line-height:1.4;}
.sems-act{height:28px;padding:0 10px;border-radius:5px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;margin-left:auto;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.sems-reg-btn{background:#0f2744;color:white;border:none;}
.sems-can-btn{background:white;color:#6b7280;border:1px solid #d1d5db;}
.no-data{display:none;padding:20px 14px;text-align:center;background:#f8fafc;border-bottom:1px solid #e8ecf0;}
.no-data.on{display:block;}
.no-data-txt{font-size:13px;color:#6b7280;line-height:1.7;}

/* ── Form area ── */
.form{padding:10px 14px 14px;}
.form.dim{opacity:.55;pointer-events:none;}
.sec-hdr{display:flex;align-items:center;gap:8px;margin:0 0 10px;}
.sec-num{width:22px;height:22px;border-radius:50%;background:#0f2744;color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sec-ttl{font-size:13px;font-weight:700;color:#0f2744;}

/* 섹션 구분선 */
.sec-sep{margin:22px 0 22px;border:none;border-top:2px solid #e2e8f0;}

/* ── Facility card ── */
.fcard{background:white;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:9px;overflow:hidden;}
.fcard.fcard-off{opacity:.4;}
.fcard-hdr{display:flex;align-items:center;gap:9px;padding:11px 13px 9px;border-bottom:1px solid #f3f4f6;}
.fnum{width:24px;height:24px;border-radius:50%;background:#0f2744;color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fname{font-size:13px;font-weight:600;color:#0f2744;flex:1;}
.ftotal{font-size:12px;font-weight:600;color:#6b7280;white-space:nowrap;}
.fcard-body{padding:11px 13px;}
.fcard-inactive{padding:11px 13px;font-size:13px;color:#9ca3af;text-align:center;}

/* ── Time inputs ── */
.trow{display:flex;align-items:center;margin-bottom:9px;}
.trow:last-child{margin-bottom:0;}
.tlbl{font-size:12px;color:#6b7280;width:36px;flex-shrink:0;}
.tinps{display:flex;align-items:center;gap:4px;}
.tinp{width:52px;height:36px;border:1px solid #e2e8f0;border-radius:8px;text-align:center;font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none;color:#94a3b8;}
.tinp:focus{border-color:#0f2744;}
.tcolon{font-size:15px;color:#9ca3af;font-weight:700;}

/* ── Status buttons ── */
.srow{display:flex;gap:8px;margin-top:11px;}
.sbtn{flex:1;height:34px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:1.5px solid #e5e7eb;background:white;color:#9ca3af;-webkit-tap-highlight-color:transparent;transition:all .12s;}
.sbtn.snorm{background:#dcfce7;color:#15803d;border-color:#16a34a;}
.sbtn.sabnorm{background:#fee2e2;color:#b91c1c;border-color:#dc2626;}

/* ── Power inputs ── */
.prow{display:flex;align-items:center;margin-bottom:8px;}
.prow:last-child{margin-bottom:0;}
.plbl{font-size:12px;color:#6b7280;width:68px;flex-shrink:0;}
.pinp{flex:1;height:36px;border:1px solid #e2e8f0;border-radius:8px;padding:0 10px;font-size:14px;font-family:inherit;color:#0f2744;outline:none;}
.pinp:focus{border-color:#0f2744;}
.pinp.auto{background:#f8fafc;color:#9ca3af;cursor:not-allowed;}
.pinp.today-inp{border-radius:8px 0 0 8px;border-right:none;}
.pr-step-wrap{display:flex;flex-direction:column;}
.pr-step-btn{min-width:32px;height:18px;padding:0;border:1px solid #e2e8f0;background:#f8fafc;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
.pr-step-btn:first-child{border-radius:0 8px 0 0;border-bottom:none;}
.pr-step-btn:last-child{border-radius:0 0 8px 0;}
.pr-step-btn:active{background:#e2e8f0;}
.mob-pr-auto{color:#9ca3af!important;}
.punit{font-size:12px;color:#9ca3af;margin-left:6px;flex-shrink:0;width:30px;}
.pval{flex:1;height:36px;display:flex;align-items:center;padding:0 10px;font-size:14px;font-weight:600;color:#9ca3af;}

/* ── Bottom bar ── */
.bot-bar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e8ecf0;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0));display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:100;}
.prog-txt{font-size:12px;color:#6b7280;line-height:1.4;}
.save-btn{height:42px;padding:0 22px;background:#0f2744;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.save-btn:disabled{opacity:.5;cursor:not-allowed;}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.on{display:flex;}
.modal{background:white;border-radius:14px;padding:20px;width:100%;max-width:340px;}
.modal-ttl{font-size:15px;font-weight:700;color:#0f2744;margin-bottom:8px;}
.modal-body{font-size:13px;color:#374151;line-height:1.6;margin-bottom:16px;white-space:pre-line;}
.modal-btns{display:flex;gap:8px;}
.mbtn-c{flex:1;height:40px;border:1px solid #e2e8f0;background:white;border-radius:8px;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;font-family:inherit;}
.mbtn-ok{flex:1;height:40px;background:#0f2744;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}

/* ── Toast ── */
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:rgba(15,39,68,.92);color:white;padding:10px 20px;border-radius:8px;font-size:13px;z-index:300;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;}
.toast.on{opacity:1;}
/* ── 날짜 화살표 + 미입력 버튼 ── */
.arr-btn{width:30px;height:38px;border:1px solid #e2e8f0;border-radius:8px;background:white;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;color:#374151;flex-shrink:0;padding:0;-webkit-tap-highlight-color:transparent;line-height:1;}
.miss-btn{width:100%;height:34px;border:1px solid #d1d5db;border-radius:8px;background:white;color:#6b7280;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;margin-top:7px;}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="hdr-inner">
    <button class="back-btn" onclick="goBack()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="hdr-title">대기운영일지</span>
    <div class="hdr-space"></div>
  </div>
</div>

<!-- Controls -->
<div class="ctrl-wrap">
  <div class="mode-seg">
    <button class="mode-btn on" id="btn-new" onclick="setMode('new')">신규 입력</button>
    <button class="mode-btn" id="btn-edit" onclick="setMode('edit')">조회 · 수정</button>
  </div>
  <div class="date-row">
    <span class="date-lbl">운전일자</span>
    <button class="arr-btn" onclick="mobDateShift(-1)" title="하루 전">&#8249;</button>
    <input type="date" class="date-inp" id="date-inp" oninput="onDateChange()" style="flex:1;min-width:0;">
    <button class="arr-btn" id="mob-date-next" onclick="mobDateShift(1)" title="하루 후">&#8250;</button>
    <button class="qry-btn" id="qry-btn" onclick="queryEdit()">조회</button>
    <span class="status-chip chip-new" id="status-chip">미입력</span>
  </div>
  <button class="miss-btn" onclick="mobJumpMissing()">미입력 일자로 이동</button>
</div>

<!-- Edit banner -->
<div class="edit-banner" id="edit-banner">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#854d0e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  <span class="edit-banner-txt" id="edit-banner-txt"></span>
</div>

<!-- SEMS row -->
<div class="sems-row" id="sems-row"></div>

<!-- No data -->
<div class="no-data" id="no-data">
  <p class="no-data-txt">해당 일자 기록이 없습니다.<br>[신규 입력] 탭에서 작성해 주세요.</p>
</div>

<!-- Form -->
<div class="form" id="form">
  <div class="sec-hdr">
    <div class="sec-num">1</div>
    <span class="sec-ttl">배출구별 가동시간</span>
  </div>
  <div id="em-cards"></div>
  <hr class="sec-sep">
  <div class="sec-hdr">
    <div class="sec-num">2</div>
    <span class="sec-ttl">방지시설 전력사용량</span>
  </div>
  <div id="pr-cards"></div>
</div>

<!-- Bottom bar -->
<div class="bot-bar">
  <span class="prog-txt" id="prog"></span>
  <button class="save-btn" id="save-btn" onclick="onSave()">저장</button>
</div>

<!-- Modal (2 buttons) -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-ttl" id="modal-ttl">확인</div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-btns">
      <button class="mbtn-c" id="modal-cancel" onclick="closeModal()">취소</button>
      <button class="mbtn-ok" id="modal-ok">확인</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
// ── Constants ──
var EM_NOS=[1,2,3,4,5,6,7,9];
var PR_NOS=[1,2,3,4,5,6,7,8,9];
var EM_NAMES={
  1:'탈청시설 (200HP)',2:'도장시설 (600㎥)',3:'도장시설 (600㎥)',
  4:'도장시설 (600㎥)',5:'건조시설 (345.6㎥)',6:'도장 및 건조시설 (319㎥)',
  7:'도장 및 건조시설 (319㎥)',8:'연마시설 (238.5㎥)',9:'도장시설 (656.6㎥)'
};
var PR_NAMES={
  1:'여과집진시설',2:'흡착에의한시설',3:'흡착에의한시설',
  4:'흡착에의한시설',5:'흡착에의한시설',6:'1차여과, 2차흡착',
  7:'1차여과, 2차흡착',8:'흡착에의한시설',9:'흡착에의한시설'
};
// 1번: 08:00~13:00 (5.0h), 나머지: 08:00~17:00 (9.0h)
var EM_DEF={1:{sh:'08',sm:'00',eh:'13',em:'00'},_:{sh:'08',sm:'00',eh:'17',em:'00'}};

// ── State ──
var currentUser=null;
var mode='new';
var emStatus={};
var prevPow={};
var semsState={registered:false,at:null,by:null};

function g(id){return document.getElementById(id);}
function pad2(n){return String(n).padStart(2,'0');}
function today(){return new Date().toISOString().split('T')[0];}
function isRO(){return currentUser&&currentUser.username==='tc1234';}
function canEdit9(){
  if(!currentUser) return false;
  if(currentUser.username==='yjyeom') return true;
  return !!(currentUser.permissions&&currentUser.permissions.airlog_9);
}

// ── Boot ──
(function init(){
  var stored=localStorage.getItem('tc_user');
  if(!stored){window.location.href='login.html';return;}
  currentUser=JSON.parse(stored);
  g('date-inp').value=today();
  buildCards();
  setMode('new');
  _applyMobPerms();
})();

function _applyMobPerms(){
  if(canEdit9()) return;
  var noPerm='font-size:10px;color:#9ca3af;margin-left:auto;padding-left:6px;';
  ['ec9','pc9'].forEach(function(cid){
    var card=g(cid); if(!card) return;
    card.style.opacity='0.4';
    card.querySelectorAll('input,button').forEach(function(el){el.disabled=true;el.style.cursor='not-allowed';});
    var hdr=card.querySelector('.fcard-hdr');
    if(hdr&&!hdr.querySelector('.mob-no-perm')){
      var lbl=document.createElement('span');lbl.className='mob-no-perm';lbl.textContent='권한 없음';lbl.style.cssText=noPerm;hdr.appendChild(lbl);
    }
  });
}

function goBack(){window.location.href='admin.html';}

// ── Build cards (HTML structure only, no values) ──
function buildCards(){
  var emH='';
  [1,2,3,4,5,6,7,8,9].forEach(function(n){
    if(n===8){
      emH+='<div class="fcard fcard-off">'+
        '<div class="fcard-hdr"><div class="fnum">8</div><span class="fname">'+EM_NAMES[8]+'</span></div>'+
        '<div class="fcard-inactive">미가동</div></div>';
      return;
    }
    emH+='<div class="fcard" id="ec'+n+'">'+
      '<div class="fcard-hdr">'+
        '<div class="fnum">'+n+'</div>'+
        '<span class="fname">'+EM_NAMES[n]+'</span>'+
        '<span class="ftotal" id="et'+n+'">-</span>'+
      '</div>'+
      '<div class="fcard-body">'+
        '<div class="trow"><span class="tlbl">시작</span><div class="tinps">'+
          '<input type="text" inputmode="numeric" class="tinp" id="sh'+n+'" maxlength="2" placeholder="08" oninput="markUser(this);calcH('+n+')" onfocus="alAutoFocus(this)">'+
          '<span class="tcolon">:</span>'+
          '<input type="text" inputmode="numeric" class="tinp" id="sm'+n+'" maxlength="2" placeholder="00" oninput="markUser(this);calcH('+n+')" onfocus="alAutoFocus(this)">'+
        '</div></div>'+
        '<div class="trow"><span class="tlbl">종료</span><div class="tinps">'+
          '<input type="text" inputmode="numeric" class="tinp" id="eh'+n+'" maxlength="2" placeholder="18" oninput="markUser(this);calcH('+n+')" onfocus="alAutoFocus(this)">'+
          '<span class="tcolon">:</span>'+
          '<input type="text" inputmode="numeric" class="tinp" id="em'+n+'" maxlength="2" placeholder="00" oninput="markUser(this);calcH('+n+')" onfocus="alAutoFocus(this)">'+
        '</div></div>'+
        '<div class="srow">'+
          '<button class="sbtn" id="sn'+n+'" onclick="setSt('+n+',\'정상\')">정상</button>'+
          '<button class="sbtn" id="sa'+n+'" onclick="setSt('+n+',\'비정상\')">비정상</button>'+
        '</div>'+
      '</div></div>';
    emStatus[n]=null;
  });
  g('em-cards').innerHTML=emH;

  var prH='';
  PR_NOS.forEach(function(n){
    prH+='<div class="fcard" id="pc'+n+'">'+
      '<div class="fcard-hdr"><div class="fnum">'+n+'</div><span class="fname">'+PR_NAMES[n]+'</span></div>'+
      '<div class="fcard-body">'+
        '<div class="prow"><span class="plbl">전일검침</span>'+
          '<input type="number" class="pinp auto" id="pp'+n+'" readonly placeholder="-">'+
          '<span class="punit">kWh</span></div>'+
        '<div class="prow"><span class="plbl">당일검침</span>'+
          '<div style="display:flex;align-items:stretch;flex:1;">'+
            '<input type="number" class="pinp today-inp" id="pt'+n+'" placeholder="입력" oninput="mobPrMarkUser(this,'+n+');calcD('+n+')">'+
            '<div class="pr-step-wrap">'+
              '<button class="pr-step-btn" onclick="mobPrStep('+n+',1)">▲</button>'+
              '<button class="pr-step-btn" onclick="mobPrStep('+n+',-1)">▼</button>'+
            '</div>'+
          '</div>'+
          '<span class="punit">kWh</span></div>'+
        '<div class="prow"><span class="plbl">당일사용량</span>'+
          '<div class="pval" id="pd'+n+'">-</div>'+
          '<span class="punit">kWh</span></div>'+
      '</div></div>';
  });
  g('pr-cards').innerHTML=prH;
  updProg();
}

// ── markUser: 사용자가 직접 수정하면 진한 색으로 전환 ──
function markUser(el){
  el.style.color='#1a2230';
}

// ── Mode switch ──
function setMode(m){
  mode=m;
  g('btn-new').className='mode-btn'+(m==='new'?' on':'');
  g('btn-edit').className='mode-btn'+(m==='edit'?' on':'');
  g('qry-btn').style.display=m==='edit'?'':'none';
  var chip=g('status-chip'); if(chip) chip.style.display=m==='new'?'':'none';
  hideBanners();
  if(m==='new'){
    g('save-btn').style.display='';
    g('save-btn').textContent='저장';
    g('form').className='form';
    fillDefs();
    var d=g('date-inp').value;
    if(d){loadPrev(d);updateChip(d);}
  } else {

// 자동값 세팅 (회색)
function setAutoV(id,val){

}
// 사용자 값 세팅 (진한 검은색)
function setUserV(id,val){

function clearPrev(){
  prevPow={};
  PR_NOS.forEach(function(n){var el=g('pp'+n);if(el)el.value='';});

// ── edit 모드 폼 초기화 ──
function clearEdit(){
  EM_NOS.forEach(function(n){
    var ids=['sh','sm','eh','em'];
    ids.forEach(function(k){var el=g(k+n);if(el){el.value='';el.style.color='#94a3b8';}});

  });
  PR_NOS.forEach(function(n){
    var pp=g('pp'+n),pt=g('pt'+n),pd=g('pd'+n);

    if(pd){pd.textContent='-';pd.style.color='#9ca3af';}
  });
  prevPow={}; updProg();
}

// ── 가동시간 자동 계산 ──
function calcH(n){
  var shv=g('sh'+n).value,smv=g('sm'+n).value;
  var ehv=g('eh'+n).value,emv=g('em'+n).value;
  var et=g('et'+n);
  if(shv===''||ehv===''){if(et)et.textContent='-';updProg();return;}
  var start=parseInt(shv)*60+(parseInt(smv)||0);
  var end=parseInt(ehv)*60+(parseInt(emv)||0);
  if(end>start){
    var total=end-start;
    var overlapStart=Math.max(start,720);
    var overlapEnd=Math.min(end,780);
    total-=Math.max(0,overlapEnd-overlapStart);
    if(et)et.textContent='총 '+(total/60).toFixed(1)+'h';
  }else{if(et)et.textContent='-';}
  updProg();
}

// ── 상태 버튼 ──
function setSt(n,st,silent){
  emStatus[n]=st; setStVisual(n,st);
  if(!silent) updProg();
}
function setStVisual(n,st){
  var sn=g('sn'+n),sa=g('sa'+n); if(!sn||!sa) return;
  sn.className='sbtn'+(st==='정상'?' snorm':'');
  sa.className='sbtn'+(st==='비정상'?' sabnorm':'');
}

function mobPrMarkUser(el,no){
  el.classList.remove('mob-pr-auto');
  var pv=prevPow[no]!=null?prevPow[no]:null;
  if(pv!=null&&el.value!==''&&parseFloat(el.value)<pv){
    showToast(no+'번: 당일검침이 전일검침보다 작습니다');
    el.value=pv;
    el.classList.add('mob-pr-auto');
  }
}
function mobPrStep(no,dir){
  var el=g('pt'+no);
  if(!el||el.disabled)return;
  var pv=prevPow[no]!=null?prevPow[no]:null;
  var cur=el.value!==''?parseFloat(el.value):(pv!=null?pv:0);
  var next=cur+dir;
  if(pv!=null&&next<pv){showToast(no+'번: 전일검침보다 작아질 수 없습니다');return;}
  if(next<0)return;
  el.value=next;
  el.classList.remove('mob-pr-auto');
  calcD(no);
}
// ── 당일사용량 자동 계산 ──
function calcD(n){
  var tv=g('pt'+n).value!==''?parseFloat(g('pt'+n).value):null;
  var pv=prevPow[n]!=null?prevPow[n]:null;
  var pd=g('pd'+n); if(!pd) return;
  if(tv!=null&&pv!=null){
    var diff=tv-pv;
    pd.textContent=diff>=0?diff.toFixed(0):'오류';
    var _isAuto=g('pt'+n).classList.contains('mob-pr-auto');
    pd.style.color=diff<0?'#dc2626':(_isAuto?'#9ca3af':'#0f2744');
  } else {pd.textContent='-';pd.style.color='#9ca3af';}
  updProg();
}

// ── 전일검침 자동 불러오기 (이 날짜 이전 중 가장 최근 기록) ──
async function loadPrev(date){
  prevPow={};
  var step1=await sbGet('air_operation_log','?log_date=lt.'+date+'&facility_type=eq.방지시설&select=log_date&order=log_date.desc&limit=1');
  if(!step1||!step1.length) return;
  var prevDate=step1[0].log_date;
  var data=await sbGet('air_operation_log','?log_date=eq.'+prevDate+'&facility_type=eq.방지시설&select=facility_no,power_today&order=facility_no.asc');
  if(data&&data.length){
    data.forEach(function(r){
      if(r.power_today!=null){
        prevPow[r.facility_no]=r.power_today;
        var el=g('pp'+r.facility_no); if(el) el.value=r.power_today;
      }
    });
    PR_NOS.forEach(function(n){
      if(prevPow[n]!=null){
        var _pt=g('pt'+n);
        if(_pt&&!_pt.disabled&&_pt.value===''){_pt.value=prevPow[n];_pt.classList.add('mob-pr-auto');}
      }
      calcD(n);
    });
  }
}

// ── 진행 카운트 ──
function updProg(){
  var emC=EM_NOS.filter(function(n){return !!emStatus[n];}).length;
  var prC=PR_NOS.filter(function(n){var e=g('pt'+n);return e&&e.value!=='';}).length;
  var el=g('prog'); if(el) el.textContent='가동시간 '+emC+'/'+EM_NOS.length+' · 전력사용량 '+prC+'/'+PR_NOS.length;

// ── 조회·수정 모드: 일자 선택 시 자동 조회 ──
async function queryEdit(){
  var date=g('date-inp').value;
  if(!date){showToast('날짜를 선택해주세요.');return;}
  hideBanners(); clearEdit();
  g('form').className='form';

  var data=await sbGet('air_operation_log','?log_date=eq.'+date+'&select=*&order=facility_type.asc,facility_no.asc');
  if(!data||!data.length){
    g('no-data').className='no-data on';
    g('form').className='form dim';
    g('save-btn').style.display='none';
    return;
  }

  g('save-btn').style.display=''; g('save-btn').textContent='수정 저장';

  // SEMS 상태
  semsState={registered:data[0].sems_registered||false,at:data[0].sems_registered_at||null,by:data[0].sems_registered_by||null};

  // 노란 배너
  var subs=[...new Set(data.filter(function(r){return r.submitted_by;}).map(function(r){return r.submitted_by;}))];
  g('edit-banner-txt').textContent='수정 모드 · '+date+' 자료를 불러왔습니다. 값을 고친 뒤 [수정 저장]을 눌러주세요.'+(subs.length?'\n최종 제출: '+subs.join(', '):'');
  g('edit-banner').className='edit-banner on';
  renderSems(date);

  // 전일검침 (DB에 없으면 자동 조회)
  await loadPrevEdit(date);

  // 폼 채우기 (사용자 입력값 = 진한 색)
  data.forEach(function(r){
    if(r.facility_type==='배출구'&&r.facility_no!==8){
      var n=r.facility_no;
      if(r.start_time){var p=r.start_time.split(':');setUserV('sh'+n,p[0]||'');setUserV('sm'+n,p[1]||'');}
      if(r.end_time){var p=r.end_time.split(':');setUserV('eh'+n,p[0]||'');setUserV('em'+n,p[1]||'');}
      calcH(n);
      if(r.operation_hours!=null){var et=g('et'+n);if(et)et.textContent='총 '+r.operation_hours+'h';}
      if(r.status){setSt(n,r.status);}
    }
    if(r.facility_type==='방지시설'){

      if(r.power_today!=null){setUserV('pt'+n,r.power_today);}
      calcD(n);
    }
  });

}

async function loadPrevEdit(date){
  var step1=await sbGet('air_operation_log','?log_date=lt.'+date+'&facility_type=eq.방지시설&select=log_date&order=log_date.desc&limit=1');

  var prevDate=step1[0].log_date;

}

// ── SEMS ──
function renderSems(date){
  var row=g('sems-row'); if(!row) return;
  row.className='sems-row on';
  if(semsState.registered){
    var tStr=semsState.at?fmtAt(semsState.at):'';
    var bStr=semsState.by?semsState.by+' 님이 등록 확인':'';
    row.innerHTML=
      '<span class="sems-lbl">SEMS</span>'+
      '<span class="sems-badge sems-done">등록 완료</span>'+
      '<span class="sems-desc">'+(tStr?tStr:'')+(bStr?' · '+bStr:'')+'</span>'+
      '<button class="sems-act sems-can-btn" onclick="actSems(\'cancel\',\''+date+'\')">등록 취소</button>';
  } else {
    row.innerHTML=
      '<span class="sems-lbl">SEMS</span>'+
      '<span class="sems-badge sems-pend">미등록</span>'+
      '<span class="sems-desc">이 날짜 데이터를 SEMS에 등록해 주세요.</span>'+
      '<button class="sems-act sems-reg-btn" onclick="actSems(\'register\',\''+date+'\')">SEMS 등록 확인</button>';
  }
}

function fmtAt(iso){
  var d=new Date(iso);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}

function actSems(action,date){
  if(isRO()){showToast('테스트 계정은 조회만 가능합니다');return;}
  var isReg=(action==='register');
  var title=isReg?'SEMS 등록 확인':'SEMS 등록 취소';
  var body=isReg?'이 일자('+date+') 데이터를 SEMS에 등록 완료한 것으로 처리할까요?':'SEMS 등록 완료를 취소하시겠습니까?';
  showModal(title,body,isReg?'등록 확인':'취소 확인',async function(){
    var now=new Date().toISOString();
    var by=currentUser.name||currentUser.username;
    var payload=isReg?{sems_registered:true,sems_registered_at:now,sems_registered_by:by}:{sems_registered:false,sems_registered_at:null,sems_registered_by:null};
    var res=await sbPatch('air_operation_log?log_date=eq.'+date,payload);
    if(res&&res.ok){
      semsState=isReg?{registered:true,at:now,by:by}:{registered:false,at:null,by:null};
      renderSems(date); showToast(isReg?'SEMS 등록 완료':'SEMS 등록 취소됨');
    } else {showToast('처리 실패');}
  });
}

// ── Save ──
function onSave(){
  if(isRO()){showToast('테스트 계정은 조회만 가능합니다');return;}
  // 신규 모드: 부분 입력 검증
  if(mode==='new'){
    var _emShortNames={1:'탈청시설(1번)',2:'도장시설(2번)',3:'도장시설(3번)',4:'도장시설(4번)',5:'건조시설(5번)',6:'도장및건조시설(6번)',7:'도장및건조시설(7번)',9:'도장시설(9번)'};
    for(var _pi=0;_pi<EM_NOS.length;_pi++){
      var _pn=EM_NOS[_pi];
      var _shEl=g('sh'+_pn); if(_shEl&&_shEl.disabled) continue;
      var _hasStart=_shEl&&_shEl.value!=='';
      var _ehEl=g('eh'+_pn);
      var _hasEnd=_ehEl&&_ehEl.value!=='';
      if(_hasStart!==_hasEnd){
        showToast(_emShortNames[_pn]+' 시작/종료 시간을 모두 입력해주세요');
        return;
      }
    }
    var _hasAnyEm=EM_NOS.some(function(n){var el=g('sh'+n);return el&&!el.disabled&&el.value!==''&&g('eh'+n)&&g('eh'+n).value!==''&&!!emStatus[n];});
    var _hasAnyPr=PR_NOS.some(function(n){var el=g('pt'+n);return el&&el.value!=='';});
    if(!_hasAnyEm&&!_hasAnyPr){showToast('입력된 데이터가 없습니다');return;}
  }
  var isMod=mode==='edit';
  if(isMod){
    var emM=EM_NOS.filter(function(n){return !emStatus[n];}).length;
    var prM=PR_NOS.filter(function(n){var e=g('pt'+n);return !e||e.value==='';}).length;
    if(emM>0||prM>0){
      var parts=[];
      if(emM>0) parts.push('가동시간 미입력 '+emM+'개');
      if(prM>0) parts.push('전력사용량 미입력 '+prM+'개');
      showModal('미입력 항목 확인',parts.join(', ')+'입니다.\n미입력 시설을 제외하고 저장하시겠어요?','저장',doSave);
      return;
    }
  }
  if(mode==='new'){
    var _mActive=0,_mIdle=[],_mEmpty=0,_mUsage=0;
    PR_NOS.forEach(function(n){
      if(n===9&&!canEdit9())return;
      var _el=g('pt'+n);if(!_el||_el.disabled)return;
      if(_el.value===''){_mEmpty++;return;}
      var _tv=parseFloat(_el.value);
      var _pv=prevPow[n]!=null?prevPow[n]:null;
      if(_pv!=null&&_tv===_pv){_mIdle.push(n+'번 '+PR_NAMES[n]);}
      else if(_pv!=null&&_tv>_pv){_mActive++;_mUsage+=(_tv-_pv);}
      else{_mActive++;}
    });
    if(_mIdle.length>0){
      var _ml=[];
      _ml.push('가동: '+_mActive+'개 시설'+(_mUsage>0?' (총 '+_mUsage.toFixed(0)+' kWh)':''));
      _ml.push('미가동(사용량 0): '+_mIdle.length+'개 시설');
      _mIdle.forEach(function(x){_ml.push('  · '+x);});
      if(_mEmpty>0){_ml.push('미입력: '+_mEmpty+'개 시설');_ml.push('');_ml.push('⚠️ 미입력 시설이 있습니다. 입력 후 저장 권장.');}
      _ml.push('');
      _ml.push('미가동 시설들이 정말 가동 안 했는지 확인해 주세요.');
      showModal('전력사용량 확인',_ml.join('\n'),'저장',doSave,'취소');
      return;
    }
  }
  showModal(isMod?'수정하시겠습니까?':'저장하시겠습니까?','',isMod?'수정':'저장',doSave);
}

async function doSave(){
  var date=g('date-inp').value;
  if(!date){showToast('날짜를 선택해주세요.');return;}

  // 신규 모드: 기존 데이터 있으면 차단
  if(mode==='new'){
    var existing=await sbGet('air_operation_log','?log_date=eq.'+date+'&select=id&limit=1');
    if(existing&&existing.length){
      showAlert('이미 작성된 일자입니다.\n수정하시려면 [조회·수정] 탭을 이용해 주세요.');
      return;
    }
  }

  var btn=g('save-btn'); btn.disabled=true; btn.textContent='저장 중...';
  var by=currentUser.name||currentUser.username;
  // 수정 모드: 이전 당일검침 스냅샷
  var _mobOldPrTodayMap={};
  if(mode==='edit'){
    var _snap=await sbGet('air_operation_log','?log_date=eq.'+date+'&facility_type=eq.방지시설&select=facility_no,power_today');
    (_snap||[]).forEach(function(r){if(r.power_today!=null)_mobOldPrTodayMap[r.facility_no]=parseFloat(r.power_today);});
  }
  var semsReg=mode==='edit'?semsState.registered:false;
  var semsAt=mode==='edit'?semsState.at:null;
  var semsBy2=mode==='edit'?semsState.by:null;
  var recs=[];

  var _canEdit9=canEdit9();
  EM_NOS.forEach(function(n){
    if(n===9&&!_canEdit9) return;
    var sh=g('sh'+n).value,sm=g('sm'+n).value,eh=g('eh'+n).value,em=g('em'+n).value;
    if(!sh&&!eh) return;
    var startM=(parseInt(sh)||0)*60+(parseInt(sm)||0);
    var endM=(parseInt(eh)||0)*60+(parseInt(em)||0);
    var hr=null;
    if(endM>startM){
      var total=endM-startM;
      var olS=Math.max(startM,720),olE=Math.min(endM,780);
      total-=Math.max(0,olE-olS);
      hr=parseFloat((total/60).toFixed(1));
    }
    recs.push({
      log_date:date,submitted_by:by,facility_no:n,facility_name:EM_NAMES[n],facility_type:'배출구',
      start_time:(sh||sm)?(pad2(parseInt(sh)||0)+':'+pad2(parseInt(sm)||0)):null,
      end_time:(eh||em)?(pad2(parseInt(eh)||0)+':'+pad2(parseInt(em)||0)):null,
      operation_hours:hr,status:emStatus[n]||'정상',
      power_prev:null,power_today:null,power_daily:null,
      sems_registered:semsReg,sems_registered_at:semsAt,sems_registered_by:semsBy2
    });
  });

  PR_NOS.forEach(function(n){
    if(n===9&&!_canEdit9) return;
    var el=g('pt'+n); if(!el||el.value==='') return;
    var tv=parseFloat(el.value);
    var pv=prevPow[n]!=null?prevPow[n]:null;
    var daily=(pv!=null&&!isNaN(tv)&&tv-pv>=0)?(tv-pv):null;
    recs.push({
      log_date:date,submitted_by:by,facility_no:n,facility_name:PR_NAMES[n],facility_type:'방지시설',
      start_time:null,end_time:null,operation_hours:null,status:null,
      power_prev:pv,power_today:tv,power_daily:daily,
      sems_registered:semsReg,sems_registered_at:semsAt,sems_registered_by:semsBy2
    });
  });

  if(!recs.length){
    showToast('저장할 데이터가 없습니다.');
    btn.disabled=false; btn.textContent=mode==='edit'?'수정 저장':'저장'; return;
  }

  try{
    var delQ='?log_date=eq.'+date+'&submitted_by=eq.'+encodeURIComponent(by);
    await fetch(SB_URL+'/rest/v1/air_operation_log'+delQ,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    var res=await fetch(SB_URL+'/rest/v1/air_operation_log',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
      body:JSON.stringify(recs)
    });
    if(!res.ok){var t=await res.text();throw new Error(t);}
    showToast(mode==='edit'?'수정 저장 완료':'저장 완료');
    if(mode==='new') updateChip(date);
    if(mode==='edit') _mobCheckNextDayPrev(date,_mobOldPrTodayMap,recs);
  } catch(e){
    showToast('저장 실패'); console.error(e);
  }
  btn.disabled=false; btn.textContent=mode==='edit'?'수정 저장':'저장';
}

// ── Supabase helpers ──
async function sbGet(table,q){
  try{
    var r=await fetch(SB_URL+'/rest/v1/'+table+(q||''),{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    return r.json();
  } catch(e){return null;}
}
async function sbPatch(path,body){
  try{
    return await fetch(SB_URL+'/rest/v1/'+path,{
      method:'PATCH',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
      body:JSON.stringify(body)
    });
  } catch(e){return null;}
}

// ── UI helpers ──
function showToast(msg){
  var el=g('toast'); el.textContent=msg; el.className='toast on';
  setTimeout(function(){el.className='toast';},2500);
}
function showModal(title,body,okLbl,cb,cancelLbl){
  g('modal-ttl').textContent=title;
  g('modal-body').textContent=body;
  g('modal-ok').textContent=okLbl;
  g('modal-ok').onclick=function(){closeModal();cb();};
  var mc=g('modal-cancel'); if(mc){mc.style.display='';mc.textContent=cancelLbl||'취소';}
  g('modal').className='modal-bg on';
}
function showAlert(body){
  g('modal-ttl').textContent='알림';
  g('modal-body').textContent=body;
  g('modal-ok').textContent='확인';
  g('modal-ok').onclick=function(){closeModal();};
  var mc=g('modal-cancel'); if(mc) mc.style.display='none';
  g('modal').className='modal-bg on';
}
function closeModal(){g('modal').className='modal-bg';}

// ── 날짜 화살표 이동 ──
function mobDateShift(delta){
  var el=g('date-inp'); if(!el||!el.value) return;
  var d=new Date(el.value+'T00:00:00');
  d.setDate(d.getDate()+delta);
  var t=new Date();t.setHours(0,0,0,0);
  if(d>t) return;
  el.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  var nb=g('mob-date-next');
  if(nb){var n2=new Date(d);n2.setDate(n2.getDate()+1);nb.style.opacity=n2>t?'0.4':'1';}
  onDateChange();
}

// ── 미입력 일자로 이동 ──
async function mobJumpMissing(){
  var SYS_START='2026-04-01';
  showToast('조회 중...');
  var t=new Date();t.setHours(0,0,0,0);
  var ts=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  var results=await Promise.all([
    sbGet('air_operation_log','?log_date=gte.'+SYS_START+'&log_date=lte.'+ts+'&select=log_date&limit=9999'),
    sbGet('holidays','?is_active=eq.true&select=holiday_date')
  ]);
  var logged=new Set((results[0]||[]).map(function(r){return r.log_date;}));
  var holidays=new Set((results[1]||[]).map(function(r){return r.holiday_date;}));
  var sysStart=new Date(SYS_START+'T00:00:00');
  for(var d=new Date(sysStart);d<=t;d.setDate(d.getDate()+1)){
    if(d.getDay()===0||d.getDay()===6) continue;
    var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(holidays.has(ds)) continue;
    if(!logged.has(ds)){
      g('date-inp').value=ds; onDateChange();
      showToast('미입력 일자: '+ds); return;
    }
  }
  showToast('미입력 일자가 없습니다. 모두 입력 완료된 상태입니다.');
}

// ── 자동값 입력칸 focus 시 전체 선택 (덧붙임 방지) ──
function alAutoFocus(el){
  if(el.style.color==='rgb(148, 163, 184)'||el.style.color==='#94a3b8'){
    setTimeout(function(){try{el.select();}catch(e){}},0);
  }
}

// ── 수정 저장 후: 다음 운영일 전일검침 갱신 확인 ──
async function _mobCheckNextDayPrev(date,oldTodayMap,savedRecs){
  if(!Object.keys(oldTodayMap).length) return;
  var step1=await sbGet('air_operation_log','?log_date=gt.'+date+'&facility_type=eq.방지시설&select=log_date&order=log_date.asc&limit=1');
  if(!step1||!step1.length) return;
  var nextDate=step1[0].log_date;
  var nextData=await sbGet('air_operation_log','?log_date=eq.'+nextDate+'&facility_type=eq.방지시설&select=facility_no,power_prev,power_today');
  if(!nextData||!nextData.length) return;
  var nextMap={};
  nextData.forEach(function(r){nextMap[r.facility_no]={prev:r.power_prev!=null?parseFloat(r.power_prev):null,today:r.power_today!=null?parseFloat(r.power_today):null};});
  var newTodayMap={};
  savedRecs.forEach(function(r){if(r.facility_type==='방지시설'&&r.power_today!=null)newTodayMap[r.facility_no]=r.power_today;});
  var updateMap={};
  Object.keys(oldTodayMap).forEach(function(no){
    no=parseInt(no);
    var oldVal=oldTodayMap[no];
    var nm=nextMap[no];
    var newVal=newTodayMap[no];
    if(nm&&nm.prev!=null&&oldVal!=null&&nm.prev===oldVal&&newVal!=null&&newVal!==oldVal){
      updateMap[no]=newVal;
    }
  });
  if(!Object.keys(updateMap).length) return;
  var cnt=Object.keys(updateMap).length;
  showModal(
    nextDate+' 전일검침 갱신 확인',
    '수정한 데이터가 '+nextDate+'의 전일검침으로 사용되고 있습니다 ('+cnt+'개 시설).\n'+nextDate+'의 전일검침과 당일사용량도 함께 갱신하시겠습니까?',
    '갱신',
    function(){_mobDoUpdateNextDayPrev(nextDate,updateMap,nextData);},
    '그대로 두기'
  );
}

async function _mobDoUpdateNextDayPrev(nextDate,updateMap,nextData){
  var nextTodayMap={};
  nextData.forEach(function(r){if(r.power_today!=null)nextTodayMap[r.facility_no]=parseFloat(r.power_today);});
  try{
    await Promise.all(Object.keys(updateMap).map(function(no){
      no=parseInt(no);
      var newPrev=updateMap[no];
      var nToday=nextTodayMap[no];
      var newDaily=(nToday!=null&&newPrev!=null&&(nToday-newPrev)>=0)?(nToday-newPrev):null;
      return fetch(SB_URL+'/rest/v1/air_operation_log?log_date=eq.'+nextDate+'&facility_type=eq.방지시설&facility_no=eq.'+no,{
        method:'PATCH',
        headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
        body:JSON.stringify({power_prev:newPrev,power_daily:newDaily})
      });
    }));
    showToast(nextDate+' 전일검침 갱신 완료');
  }catch(e){showToast('갱신 실패: '+e.message);console.error(e);}
}
